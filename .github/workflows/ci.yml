name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          set -e
          files=$(find . -name '*.go' -not -path './frontend/*' -not -path './extensions-dist/*')
          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would modify the following files:"
            echo "$unformatted"
            exit 1
          fi

      # The extension modules are separate Go modules, so `./...` from the root
      # does not cover them; each is built, vetted, and tested on its own.
      - name: go build/vet/test (core + every extension module)
        run: |
          set -e
          # ./... includes the root main package (app.go, app_rpc.go, todo_bridge.go,
          # subscribers.go), which the narrower patterns below would miss.
          go build ./...
          go vet ./...
          go test ./...
          for mod in $(find extensions -maxdepth 2 -name go.mod | xargs -n1 dirname | sort); do
            echo "::group::$mod"
            (cd "$mod" && go build ./... && go vet ./... && go test ./...)
            echo "::endgroup::"
          done

      # The Python extensions (media-generation) have no Go module, so they are
      # only reachable through this syntax gate.
      - name: python extension syntax
        run: |
          set -e
          for f in $(find extensions -name '*.py'); do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"
          done

      - name: staticcheck
        run: |
          set -e
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
          for mod in $(find extensions -maxdepth 2 -name go.mod | xargs -n1 dirname | sort); do
            (cd "$mod" && "$(go env GOPATH)/bin/staticcheck" ./...)
          done

      - name: dead code
        run: |
          set -e
          go install golang.org/x/tools/cmd/deadcode@latest
          # The tool reports findings on stdout but exits non-zero (message on
          # stderr) when the analysis itself fails to load the module, so its
          # status must be checked explicitly — swallowing it behind a pipe would
          # turn this into a no-op exactly when the tree does not compile.
          # No exclusions: pkg/extsdk is the cross-module SDK seam and is covered
          # by pkg/extsdk/extsdk_surface_test.go, so an uncovered SDK helper (which
          # only external extensions could reach) fails this gate instead of
          # silently rotting.
          out=$("$(go env GOPATH)/bin/deadcode" -test ./...)
          if [ -n "$out" ]; then
            echo "::error::unreachable code:"
            echo "$out"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The RPC route table is generated from frontend/wailsjs; if the bindings
      # were regenerated without it, invoke() would point at the wrong struct.
      - run: pnpm run check:rpc-routes
      - run: pnpm run build
