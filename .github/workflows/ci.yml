name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          set -e
          files=$(find . -name '*.go' -not -path './frontend/*' -not -path './extensions-dist/*')
          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would modify the following files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./internal/... ./pkg/... ./cmd/... ./extensions/...

      - name: go test
        run: go test -tags sqlite_fts5 ./internal/... ./pkg/... ./cmd/... ./extensions/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
