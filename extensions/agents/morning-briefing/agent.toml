# Morning Briefing Agent — reference agent pack
id = "morning_briefing"
name = "Morning Briefing"
description = "Generates a daily briefing summarizing recent activity, memory updates, and pending tasks"
tier = "worker"

# Run in background mode — no user interaction needed
background = true

# Restricted to read-only tools.
# briefing_generate is provided by the sibling extensions/morning-briefing
# integration extension, which owns the briefing format this pack drives.
tool_allowlist = [
  "briefing_generate",
  "memory_search",
  "memory_recall",
  "read_file",
  "list_dir",
  "todo_list",
]

max_iterations = 8
timeout_secs = 120
